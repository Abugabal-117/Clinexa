<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dash-header">
        <div class="dash-logo">Clinic System</div>
        <a href="index.html" class="back-link">

    <div class="welcome-section">
        <h1>Welcome, John Doe</h1>
        <p>What would you like to do today?</p>
    </div>

    <div class="dash-grid">
        
        <a href="edit-profile.html" class="dash-card active">
            <div class="dash-icon-circle">
                <svg class="dash-icon-svg" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 1-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <h3>My Profile</h3>
            <p>Edit personal information and account settings</p>
        </a>

        <a href="doctor-profile.html" class="dash-card">
            <div class="dash-icon-circle">
                <svg class="dash-icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <h3>Clinic Services</h3>
            <p>View doctor profiles and book appointments</p>
        </a>

        <a href="appointments.html" class="dash-card">
            <div class="dash-icon-circle">
                <svg class="dash-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <h3>My Appointments</h3>
            <p>View and manage your upcoming and past appointments</p>
        </a>

    </div>

</html>
