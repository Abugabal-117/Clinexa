<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="nav-container">
        <a href="{{ url_for('doctor_profile') }}" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Doctor Profile
        </a>
    </div>

    <div class="center-content">
        <div class="content-card booking-container">
            <h1 style="margin-bottom: 5px;">Book an Appointment</h1>
            <p style="color:#64748b; margin-bottom: 25px;">Select a doctor, day, and time</p>

            <form action="{{ url_for('booking') }}" method="POST">
                <div class="form-group">
                    <label>Select Doctor</label>
                    <div class="input-wrapper">
                        <select name="doctor_id" class="form-control"
                            style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;" required>
                            <option value="" disabled selected>Choose a doctor...</option>
                            {% for doctor in doctors %}
                            <option value="{{ doctor.user_id }}">Dr. {{ doctor.last_name }} ({{ doctor.specialization
                                }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <div class="input-wrapper">
                        <input type="date" name="date" class="form-control"
                            style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <div class="input-wrapper">
                        <input type="time" name="time" class="form-control"
                            style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Reason for Visit</label>
                    <div class="input-wrapper">
                        <textarea name="reason" placeholder="Briefly describe the reason for your visit..."
                            style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 80px;"></textarea>
                    </div>
                </div>

                <button type="submit" class="confirm-btn btn-blue"
                    style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">
                    Confirm Booking
                </button>
            </form>
        </div>
    </div>
</body>

</html>
