<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Doctor Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="rating-page-wrapper">
        <div class="header-container">
            <a href="doctor-profile.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Doctor Profile</span>
            </a>
        </div>

        <div class="rating-card">
            <div class="text-center">
                <h2 class="rating-title">Rate Your Experience</h2>
                <p class="rating-subtitle">Share your feedback about Dr. Sarah Mitchell</p>
            </div>

            <div class="rating-stars-wrapper">
                <p class="stars-label">How would you rate your experience?</p>
                
                <div class="stars-container">
                    <input type="radio" name="rating" id="star5" value="5">
                    <label for="star5" title="5 Stars"><i class="fas fa-star"></i></label>

                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4" title="4 Stars"><i class="fas fa-star"></i></label>

                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3" title="3 Stars"><i class="fas fa-star"></i></label>

                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2" title="2 Stars"><i class="fas fa-star"></i></label>

                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1" title="1 Star"><i class="fas fa-star"></i></label>
                </div>
            </div>

            <div class="rating-input-group">
                <label class="input-label">Write your feedback (optional)</label>
                <textarea class="feedback-textarea" placeholder="Share your experience... What did you like? What could be improved?"></textarea>
            </div>

            <div class="rating-actions">
                <a href="doctor-profile.html" class="btn btn-cancel" style="text-decoration: none; text-align: center;">Cancel</a>
                
                <a href="doctor-profile.html" class="btn btn-submit" style="text-decoration: none;">
                    <i class="fas fa-paper-plane"></i>
                    Submit Feedback
                </a>
            </div>
        </div>
    </div>

</body>
</html>
