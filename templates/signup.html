<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="center-content">
        <div class="auth-card">
            <div class="role-badge">Patient</div>
            <h1>Create Account</h1>
            <p style="color:#64748b; margin-bottom:30px;">Sign up to get started</p>

            <form action="{{ url_for('signup') }}" method="POST">
                <div class="form-group">
                    <!-- Role selection hidden/removed to enforce Patient only -->
                    <input type="hidden" name="role" value="patient">
                </div>

                <div class="form-group">
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>First Name</label>
                            <div class="input-wrapper">
                                <input type="text" name="first_name" placeholder="First Name" required>
                            </div>
                        </div>
                        <div style="flex: 1;">
                            <label>Last Name</label>
                            <div class="input-wrapper">
                                <input type="text" name="last_name" placeholder="Last Name" required>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <!-- Optional fields can be handled by JS or separate pages, but for now we keep it simple -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" placeholder="Create a password" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-green">Sign Up</button>
            </form>

            <div class="link-text">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>
</body>

</html>
