<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="back-link-wrapper">
        <a href="{{ url_for('login') }}" class="back-link">← Back to Login</a>
    </div>

    <div class="center-content">
        <div class="auth-card">
            <div class="role-badge">Password Recovery</div>
            <h1>Forgot Password?</h1>
            <p style="color:#64748b; margin-bottom:30px;">Enter your email to reset your password</p>

            <form action="{{ url_for('reset_password') }}">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.103 0-2 .897-2 2v12c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zm0 2v.511l-8 6.223-8-6.222V6h16zM4 18V9.044l7.386 5.745a.994.994 0 0 0 1.228 0L20 9.044 20.002 18H4z"></path></svg>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-blue">Send Reset Link</button>
            </form>

        </div>
    </div>
</body>
</html>
