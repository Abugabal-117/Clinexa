services:
  web:
    # This tells Docker: "Look in the current folder (.) and build the Dockerfile found there"
    build: .
    container_name: clinexa_app
    ports:
      - "5000:5000"
    volumes:
      # Map local folders to the container so data is saved on the user's machine
      - ./src/data:/app/src/data
      - ./src/static/images:/app/src/static/images
    environment:
      - FLASK_APP=src/app.py
      - FLASK_ENV=development
    restart: unless-stopped
