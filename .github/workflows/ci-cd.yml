name: CI/CD Pipeline

on:
  push:
    branches: [ main, doctor-frontend, develop ]
  pull_request:
    branches: [ main, doctor-frontend, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  REGISTRY: docker.io
  IMAGE_NAME: j4b4l/clinexa

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TESTING & LINTING
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with pylint
      run: |
        pip install pylint
        find src -name "*.py" -type f | xargs pylint --disable=all --enable=E,F 2>/dev/null || echo "Linting complete"
      continue-on-error: true

    - name: Run unit tests (retry up to 3 times)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 10
        command: python run_tests_dispatch.py all

    - name: Generate coverage report
      run: |
        pip install pytest-cov
        python run_tests_dispatch.py coverage
      continue-on-error: true

  # ------------------------------------------------------------------
  # JOB 2: SECURITY SCAN
  # ------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security check
      run: |
        bandit -r src/ -ll 2>/dev/null || echo "Security scan complete"
      continue-on-error: true

    - name: Check dependencies
      run: |
        pip install -r requirements.txt
        safety check --json || echo "Safety check complete"
      continue-on-error: true

  # ------------------------------------------------------------------
  # JOB 3: BUILD & PUSH TO DOCKER HUB
  # ------------------------------------------------------------------
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # JOB 4: DEPLOYMENT STAGES (Placeholders)
  # ------------------------------------------------------------------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Development
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Deploy to dev environment
      run: |
        echo "Simulating deployment to DEV server..."
        echo "Pulling image: ${{ env.IMAGE_NAME }}:develop"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Staging
    if: github.ref == 'refs/heads/doctor-frontend' && github.event_name == 'push'

    steps:
    - name: Deploy to staging environment
      run: |
        echo "Simulating deployment to STAGING server..."
        echo "Pulling image: ${{ env.IMAGE_NAME }}:doctor-frontend"

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to production environment
      run: |
        echo "Simulating deployment to PROD server..."
        echo "Pulling image: ${{ env.IMAGE_NAME }}:main"
