name: CI/CD Pipeline

on:
  push:
    branches: [ main, doctor-frontend, develop ]
  pull_request:
    branches: [ main, doctor-frontend, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with pylint
      run: |
        pip install pylint
        find src -name "*.py" -type f | xargs pylint --disable=all --enable=E,F 2>/dev/null || echo "Linting complete"
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        python run_tests_dispatch.py all
    
    - name: Generate coverage report
      run: |
        pip install pytest-cov
        python run_tests_dispatch.py coverage
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security check
      run: |
        bandit -r src/ -ll 2>/dev/null || echo "Security scan complete"
      continue-on-error: true
    
    - name: Check dependencies
      run: |
        pip install -r requirements.txt
        safety check --json || echo "Safety check complete"
      continue-on-error: true

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name != 'pull_request'
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Development
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to dev environment
      run: |
        echo "Deploying to development environment..."
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Staging
    if: github.ref == 'refs/heads/doctor-frontend' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment..."
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:doctor-frontend"

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production environment
      run: |
        echo "Deploying to production environment..."
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
