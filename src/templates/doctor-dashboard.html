<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="dash-header">
        <div class="dash-logo">Clinic System (Doctor)</div>
        <nav class="doctor-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-link active">Dashboard</a>
            <a href="{{ url_for('edit_profile') }}" class="nav-link">Profile</a>
            <a href="{{ url_for('schedule_management') }}" class="nav-link">Schedule</a>
            <a href="{{ url_for('patient_report') }}" class="nav-link">Reports</a>
        </nav>
        <a href="{{ url_for('logout') }}" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
        </a>
    </header>

    <div class="welcome-section">
        <h1>Welcome, Dr. {{ user.last_name }}</h1>
        <p>Manage your practice and patients</p>
    </div>

    <div class="dash-grid">

        <a href="{{ url_for('edit_profile') }}" class="dash-card">
            <div class="dash-icon-circle doctor-theme">
                <svg class="dash-icon-svg doctor-theme" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <h3>My Profile</h3>
            <p>Update specialization & details</p>
        </a>

        <a href="{{ url_for('patient_report') }}" class="dash-card">
            <div class="dash-icon-circle doctor-theme">
                <svg class="dash-icon-svg doctor-theme" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <h3>Patient Reports</h3>
            <p>View history and write reports</p>
        </a>

        <a href="{{ url_for('schedule_management') }}" class="dash-card">
            <div class="dash-icon-circle doctor-theme">
                <svg class="dash-icon-svg doctor-theme" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <h3>My Schedule</h3>
            <p>Manage availability slots</p>
        </a>

    </div>
</body>

</html>
