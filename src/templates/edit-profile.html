<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit My Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="nav-container">
        <a href="{{ url_for('dashboard') }}" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </a>
    </div>

    <div class="center-content">
        <div class="content-card" style="width:100%; max-width:600px; padding: 40px;">

            <h1 style="text-align:center; font-size: 1.5rem; margin-bottom: 5px;">Edit My Profile</h1>
            <p style="text-align:center; color:#64748b; margin-bottom: 40px;">Update your personal information</p>

            <form action="{{ url_for('edit_profile') }}" method="POST">

                <div class="form-group">
                    <label>First Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" name="first_name" value="{{ user.first_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" name="last_name" value="{{ user.last_name }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                        <input type="email" name="email" value="{{ user.email }}">
                    </div>
                </div>

                {% if user.role == 'doctor' %}
                <div class="form-group">
                    <label>Specialization</label>
                    <div class="input-wrapper">
                        <input type="text" name="specialization" value="{{ user.specialization or '' }}"
                            placeholder="e.g. Cardiology">
                    </div>
                </div>
                <div class="form-group">
                    <label>License Number</label>
                    <div class="input-wrapper">
                        <input type="text" name="license_number" value="{{ user.license_number or '' }}">
                    </div>
                </div>
                {% endif %}

                {% if user.role == 'patient' %}
                <div class="form-group">
                    <label>Date of Birth</label>
                    <div class="input-wrapper">
                        <input type="date" name="date_of_birth" value="{{ user.date_of_birth or '' }}">
                    </div>
                </div>
                {% endif %}

                

                <div class="action-buttons-row">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-gray display-flex-center"
                        style="text-decoration: none;">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-green display-flex-center">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>
</body>

</html>
