[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .pytest_cache __pycache__
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --ignore=tests/test_authentication.py
    --ignore=tests/test_doctor_controller.py
    --ignore=tests/test_integration.py
    --ignore=tests/test_models.py
    --ignore=tests/test_patient_controller.py
    --ignore=tests/test_user_controller.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests as authentication tests
    patient: marks tests as patient tests
    doctor: marks tests as doctor tests
    user: marks tests as user tests
    models: marks tests as model tests
